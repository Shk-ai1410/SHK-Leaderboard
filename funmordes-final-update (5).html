<script>

<script>
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let currentUser = null;
let currentProfile = null;
let unreadCount = 0;
const app = document.getElementById('app');
const DIFFICULTIES = [7,6,5,4,3,2,1];

function msToStr(ms){if(!Number.isInteger(ms)||ms<0)return '--:--:--';const m=Math.floor(ms/60000),s=Math.floor((ms%60000)/1000),cs=Math.floor((ms%1000)/10);const p=(n,l)=>String(n).padStart(l,'0');return `${p(m,2)}:${p(s,2)}:${p(cs,2)}`;}
function parseTimeStr(str){const m=str.trim().match(/^(\d{1,3}):([0-5]\d):(\d{1,2})$/);if(!m)throw new Error('Định dạng phải là MM:SS:mm');const minutes=+m[1],seconds=+m[2],millis=+m[3].padEnd(2,'0')*10;const total=minutes*60000+seconds*1000+millis;if(total<=0||total>30*60000)throw new Error('Thời gian không hợp lệ.');return total;}
function esc(s){return (s??'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(msg,type='ok'){const el=document.createElement('div');el.className='fixed bottom-5 left-1/2 -translate-x-1/2 md:left-auto md:right-5 md:translate-x-0 z-[100] px-4 py-3 rounded-xl text-sm font-medium shadow-lg max-w-[90vw]';el.style.background=type==='ok'?'var(--ok)':'var(--err)';el.style.color='#0a0a0a';el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),3000);}
function stars(n){return '★'.repeat(n);}
function isModOrAdmin(){return currentProfile?.role==='admin'||currentProfile?.role==='moderator';}
function isAdmin(){return currentProfile?.role==='admin';}
function slugify(str){return str.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/gi,d=>d==='đ'?'d':'D').toLowerCase().trim().replace(/[^a-z0-9\s-]/g,'').replace(/\s+/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'');}
function removeDiacritics(str){return (str||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/gi,d=>d==='đ'?'d':'D').toLowerCase();}
function avatarHTML(p,size='',extra=''){const sc=size||'avatar';const initial=esc((p?.ingame_name||'?').charAt(0).toUpperCase());if(p?.avatar_url)return `<img src="${esc(p.avatar_url)}" alt="${initial}" class="${sc} ${extra}">`;return `<div class="${sc} ${extra}">${initial}</div>`;}
function userLink(username,displayName,extra=''){if(!username)return esc(displayName||'?');return `<a onclick="event.stopPropagation();navigate('/user/${esc(username)}')" class="user-link ${extra}">${esc(displayName||username)}</a>`;}
function timeAgo(d){if(!d)return '';const t=new Date(d),n=new Date(),diff=Math.floor((n-t)/1000);if(diff<60)return 'vừa xong';if(diff<3600)return `${Math.floor(diff/60)} phút trước`;if(diff<86400)return `${Math.floor(diff/3600)} giờ trước`;if(diff<86400*7)return `${Math.floor(diff/86400)} ngày trước`;if(diff<86400*30)return `${Math.floor(diff/(86400*7))} tuần trước`;if(diff<86400*365)return `${Math.floor(diff/(86400*30))} tháng trước`;return `${Math.floor(diff/(86400*365))} năm trước`;}
function fullDateTime(d){if(!d)return '';return new Date(d).toLocaleString('vi-VN',{weekday:'long',year:'numeric',month:'long',day:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'});}
function fireRpc(fn,params){(async()=>{try{await sb.rpc(fn,params);}catch(e){}})();}

const MAX_UPLOAD_MB=10;
const ALLOWED_TYPES=['image/png','image/jpeg','image/jpg','image/webp'];
async function uploadImage(bucket,file,pathPrefix,maxMB){
  const max=maxMB||MAX_UPLOAD_MB;
  if(!ALLOWED_TYPES.includes(file.type))throw new Error('Chỉ chấp nhận ảnh PNG, JPG hoặc WEBP.');
  if(file.size>max*1024*1024)throw new Error(`Ảnh vượt quá ${max}MB.`);
  const ext=file.name.split('.').pop();
  const path=`${pathPrefix}/${crypto.randomUUID()}.${ext}`;
  const {error}=await sb.storage.from(bucket).upload(path,file,{upsert:false});
  if(error)throw new Error('Lỗi tải ảnh lên: '+error.message);
  if(bucket==='evidence'){const {data,error:e2}=await sb.storage.from(bucket).createSignedUrl(path,60*60*24*7);if(e2)throw e2;return {path,url:data.signedUrl};}
  const {data}=sb.storage.from(bucket).getPublicUrl(path);
  return {path,url:data.publicUrl};
}
function filePreview(inputEl,imgEl){inputEl.addEventListener('change',()=>{const f=inputEl.files[0];if(!f)return imgEl.classList.add('hidden');imgEl.src=URL.createObjectURL(f);imgEl.classList.remove('hidden');});}// ============ COMMENTS ============
const COMMENT_SELECT = 'id,record_id,user_id,parent_id,content,created_at,profiles!comments_user_id_fkey(id,username,ingame_name,avatar_url),comment_reactions(id,user_id,sticker_id,stickers(id,name,emoji,image_url))';
async function fetchCommentsFor(recordIds){
  if(!recordIds.length) return {};
  const { data } = await sb.from('comments').select(COMMENT_SELECT).in('record_id', recordIds).order('created_at',{ascending:true});
  const g = {}; (data||[]).forEach(c=>{ (g[c.record_id]=g[c.record_id]||[]).push(c); });
  return g;
}
function renderContent(text){
  return esc(text).replace(/(^|[^A-Za-z0-9_])@([A-Za-z0-9_]{3,32})/g,(m,pre,u)=>`${pre}<a onclick="event.stopPropagation();navigate('/user/${u.toLowerCase()}')" class="user-link font-semibold" style="color:var(--blue)">@${u}</a>`);
}
function commentReactionsHTML(c){
  const g = {};
  (c.comment_reactions||[]).forEach(r=>{ const x = g[r.sticker_id] = g[r.sticker_id] || { s:r.stickers, n:0, mine:false }; x.n++; if(currentUser && r.user_id===currentUser.id) x.mine = true; });
  return Object.entries(g).map(([sid,x])=>`<span class="sticker-badge c-react ${x.mine?'active':''}" data-comment-id="${c.id}" data-sticker-id="${sid}">${stickerImgHTML(x.s,'0.9rem')} <b>${x.n}</b></span>`).join('');
}
function commentHTML(c){
  const p = c.profiles || {};
  const own = currentUser && currentUser.id === c.user_id;
  const canDelete = own || isModOrAdmin();
  return `<div class="comment" data-comment-id="${c.id}">
    <a onclick="navigate('/user/${esc(p.username)}')" class="shrink-0">${avatarHTML(p,'avatar avatar-sm')}</a>
    <div class="flex-1 min-w-0">
      <div class="comment-body">
        <div class="flex items-center gap-2 flex-wrap">
          ${userLink(p.username, p.ingame_name, 'font-semibold text-sm')}
          <span class="text-[10px] text-[--tx2]" title="${esc(fullDateTime(c.created_at))}">${timeAgo(c.created_at)}</span>
        </div>
        <div class="text-sm mt-1 break-words whitespace-pre-wrap">${renderContent(c.content)}</div>
      </div>
      <div class="comment-actions flex flex-wrap items-center gap-2">
        ${commentReactionsHTML(c)}
        ${currentUser?`<a class="sticker-add-btn c-react-add" data-comment-id="${c.id}">😀</a><a class="reply-comment" data-id="${c.id}" data-user="${esc(p.username)}">Trả lời</a>`:''}
        ${canDelete?`<a class="delete-comment" data-id="${c.id}" data-own="${!!own}" style="color:var(--err)">Xóa</a>`:''}
      </div>
    </div>
  </div>`;
}
function commentsListHTML(list){
  if(!list || !list.length) return '<div class="text-xs text-[--tx2] italic">Chưa có bình luận nào.</div>';
  const byId = {}; list.forEach(c=>byId[c.id]=c);
  const rootOf = c=>{ let x=c,g=0; while(x.parent_id && byId[x.parent_id] && g++<50) x=byId[x.parent_id]; return x; };
  const roots = list.filter(c=>rootOf(c).id===c.id);
  return roots.map(r=>commentHTML(r) + list.filter(c=>c.id!==r.id && rootOf(c).id===r.id).map(c=>`<div class="ml-8 md:ml-10">${commentHTML(c)}</div>`).join('')).join('');
}
function commentSectionHTML(recordId, comments){
  const has = comments && comments.length;
  return `<div class="comments-section border-t p-3 md:p-4" style="border-color:var(--bd)" data-record-id="${recordId}">
    <div class="flex items-center justify-between mb-2"><span class="text-sm font-semibold">💬 Bình luận ${has?`(${comments.length})`:''}</span></div>
    <div class="comments-list space-y-1" id="comments-${recordId}">${commentsListHTML(comments)}</div>
    ${currentUser ? `
      <div class="flex items-center gap-2 mt-3">
        ${avatarHTML(currentProfile,'avatar avatar-sm')}
        <input type="text" class="comment-input flex-1 !py-1.5 !px-3 text-sm" placeholder="Viết bình luận... (dùng @username để nhắc)" data-record-id="${recordId}" maxlength="1000">
        <button class="btn-p text-xs !py-1.5 !px-3 comment-send" data-record-id="${recordId}">Gửi</button>
      </div>
    ` : `<div class="text-xs text-[--tx2] mt-3"><a onclick="navigate('/login')" class="user-link">Đăng nhập</a> để bình luận.</div>`}
  </div>`;
}
function attachCommentHandlers(){} // đã chuyển sang event delegation
async function refreshComments(recordId){
  const { data } = await sb.from('comments').select(COMMENT_SELECT).eq('record_id', recordId).order('created_at',{ascending:true});
  const list = document.getElementById(`comments-${recordId}`);
  if(list) list.innerHTML = commentsListHTML(data||[]);
}
async function sendComment(recordId){
  const input = document.querySelector(`.comment-input[data-record-id="${recordId}"]`);
  const content = input.value.trim(); if(!content) return;
  const { error } = await sb.from('comments').insert({ record_id: recordId, user_id: currentUser.id, content, parent_id: input.dataset.parent || null });
  if(error) return toast(error.message,'err');
  input.value=''; delete input.dataset.parent; input.placeholder='Viết bình luận... (dùng @username để nhắc)';
  await refreshComments(recordId);
}
async function toggleCommentReaction(commentId, stickerId, recordId){
  if(!currentUser) return toast('Vui lòng đăng nhập.','err');
  const { data: ex } = await sb.from('comment_reactions').select('id').eq('comment_id',commentId).eq('user_id',currentUser.id).eq('sticker_id',stickerId).maybeSingle();
  if(ex) await sb.from('comment_reactions').delete().eq('id',ex.id);
  else await sb.from('comment_reactions').insert({ comment_id:commentId, user_id:currentUser.id, sticker_id:stickerId });
  await refreshComments(recordId);
}
async function reloadKeepScroll(){ const y=window.scrollY; await resolveRoute(); window.scrollTo(0,y); }
function postActionsHTML(r, ownerId){
  if(!currentUser) return '';
  const own = currentUser.id === ownerId;
  if(!own && !isModOrAdmin()) return '';
  return `<span class="text-xs text-[--tx2] flex gap-3">${own?`<a class="edit-note hover:text-white" data-id="${r.id}" data-note="${esc(r.note||'')}">✏️ Sửa mô tả</a>`:''}<a class="del-rec" data-id="${r.id}" data-own="${own}" style="color:var(--err)">🗑️ Xóa</a></span>`;
}
document.addEventListener('keydown', (e)=>{
  if(e.target.matches?.('.comment-input') && e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendComment(e.target.dataset.recordId); }
});
document.addEventListener('click', async (e)=>{
  const t = e.target.closest('.comment-send,.c-react,.c-react-add,.reply-comment,.delete-comment,.edit-note,.del-rec');
  if(!t) return;
  const sec = t.closest('.comments-section');
  const recId = sec?.dataset.recordId;
  try{
    if(t.matches('.comment-send')) return sendComment(t.dataset.recordId);
    if(t.matches('.c-react')) return toggleCommentReaction(t.dataset.commentId, t.dataset.stickerId, recId);
    if(t.matches('.c-react-add')){ e.stopPropagation(); return openStickerPicker(null, t, sid=>toggleCommentReaction(t.dataset.commentId, sid, recId)); }
    if(t.matches('.reply-comment')){
      const input = sec.querySelector('.comment-input');
      if(!input) return;
      input.value = `@${t.dataset.user} `; input.dataset.parent = t.dataset.id;
      input.placeholder = `Đang trả lời @${t.dataset.user}...`; input.focus(); return;
    }
    if(t.matches('.delete-comment')){
      let reason = null;
      if(t.dataset.own === 'true'){ if(!confirm('Xóa bình luận của bạn?')) return; }
      else { reason = prompt('Lý do xóa bình luận này (bắt buộc):'); if(!reason || !reason.trim()) return toast('Cần nhập lý do xóa.','err'); }
      const { error } = await sb.rpc('delete_comment', { p_id: t.dataset.id, p_reason: reason });
      if(error) return toast(error.message,'err');
      toast('Đã xóa bình luận.'); return refreshComments(recId);
    }
    if(t.matches('.edit-note')){
      const v = prompt('Sửa mô tả (tối đa 500 ký tự, để trống để xóa mô tả):', t.dataset.note || '');
      if(v === null) return;

      if(error) return toast(error.message,'err');
      toast('Đã cập nhật mô tả.'); return reloadKeepScroll();
    }
    if(t.matches('.del-rec')){
      let reason = null;
      if(t.dataset.own === 'true'){ if(!confirm('Xóa bài đăng kỷ lục này? Không thể hoàn tác.')) return; }
      else { reason = prompt('Lý do xóa bài đăng của thành viên này (bắt buộc):'); if(!reason || !reason.trim()) return toast('Cần nhập lý do xóa.','err'); }
      const { data: evPath, error } = await sb.rpc('delete_record', { p_id: t.dataset.id, p_reason: reason });
      if(error) return toast(error.message,'err');
      if(evPath){ try{ await sb.storage.from('evidence').remove([evPath]); }catch(_){} }
      toast('Đã xóa bài đăng.'); return reloadKeepScroll();
    }
  }catch(err){ toast(err.message,'err'); }
});

let allStickersCache = null;
async function loadAllStickers(){
  if(allStickersCache) return allStickersCache;
  const { data } = await sb.from('stickers').select('*').order('is_system',{ascending:false}).order('created_at',{ascending:true});
  allStickersCache = data || [];

}
function stickerImgHTML(s, size='1.3rem'){
  if(s.image_url) return `<img src="${esc(s.image_url)}" style="width:${size};height:${size};object-fit:contain" alt="${esc(s.name)}">`;
  return `<span style="font-size:${size};line-height:1">${esc(s.emoji)}</span>`;
}
async function fetchReactionsFor(recordIds){
  if(!recordIds.length) return {};
  const { data } = await sb.from('record_reactions').select('id,record_id,user_id,sticker_id,stickers(id,name,emoji,image_url)').in('record_id', recordIds);
  const grouped = {};
  (data||[]).forEach(r=>{ if(!grouped[r.record_id]) grouped[r.record_id]=[]; grouped[r.record_id].push(r); });
  return grouped;
}
function reactionsBarHTML(recordId, reactions){
  const list = reactions || [];
  const bySticker = {};
  list.forEach(r=>{
    const sid = r.sticker_id;
    if(!bySticker[sid]) bySticker[sid] = { sticker: r.stickers, count: 0, mine: false };
    bySticker[sid].count++;
    if(currentUser && r.user_id === currentUser.id) bySticker[sid].mine = true;
  });
  const badges = Object.values(bySticker).map(g=>{
    return `<span class="sticker-badge ${g.mine?'active':''}" data-record-id="${recordId}" data-sticker-id="${g.sticker.id}" data-mine="${g.mine}">${stickerImgHTML(g.sticker,'1rem')} <b>${g.count}</b></span>`;
  }).join('');
  return `<div class="reactions-bar flex flex-wrap items-center gap-2 pt-2" data-record-id="${recordId}">
    ${badges}
    ${currentUser ? `<button class="sticker-add-btn text-xs text-[--tx2] hover:text-white px-2 py-1 rounded-lg border" style="border-color:var(--bd)" data-record-id="${recordId}">+ 😀</button>` : ''}
  </div>`;
}
async function openStickerPicker(recordId, anchorEl, onPick){
  closeAllStickerPickers();
  const stickers = await loadAllStickers();
  const picker = document.createElement('div');
  picker.className = 'sticker-picker';
  const rect = anchorEl.getBoundingClientRect();
  const top = rect.bottom + window.scrollY + 6;
  let left = rect.left + window.scrollX;
  const pickerWidth = 320;
  if(left + pickerWidth > window.innerWidth - 16) left = Math.max(8, window.innerWidth - pickerWidth - 16);
  picker.style.top = top+'px';
  picker.style.left = left+'px';
  picker.innerHTML = stickers.map(s=>`
    <div style="position:relative;display:inline-block">
      <button class="sticker-item" data-sticker-id="${s.id}" title="${esc(s.name)}">${stickerImgHTML(s, '2rem')}</button>
      ${(!s.is_system && currentUser && s.created_by===currentUser.id)?`<span class="sticker-del" data-sticker-id="${s.id}" title="Xóa">✕</span>`:''}
    </div>
  `).join('') + `<button class="sticker-item" id="new-sticker-btn" style="background:var(--bg2);border:1px dashed var(--bd)">➕</button>`;
  document.body.appendChild(picker);
  picker.querySelectorAll('.sticker-item[data-sticker-id]').forEach(btn=>{
    btn.onclick = async ()=>{ await (onPick ? onPick(btn.dataset.stickerId) : toggleReaction(recordId, btn.dataset.stickerId)); closeAllStickerPickers(); };
  });
  picker.querySelectorAll('.sticker-del').forEach(el=>{
    el.onclick = async (e)=>{
      e.stopPropagation();
      if(!confirm('Xóa nhãn dán này?')) return;
      const { error } = await sb.from('stickers').delete().eq('id', el.dataset.stickerId);
      if(error){ toast(error.message,'err'); return; }
      allStickersCache = null;
      toast('Đã xóa nhãn dán.');
      closeAllStickerPickers();
      resolveRoute();
    };
  });
  picker.querySelector('#new-sticker-btn').onclick = ()=>{ closeAllStickerPickers(); openCreateStickerDialog(); };
  setTimeout(()=>{ document.addEventListener('click', outsideClosePicker); }, 50);
}
function closeAllStickerPickers(){ document.querySelectorAll('.sticker-picker').forEach(el=>el.remove()); document.removeEventListener('click', outsideClosePicker); }
function outsideClosePicker(e){ if(!e.target.closest('.sticker-picker') && !e.target.closest('.sticker-add-btn')) closeAllStickerPickers(); }
async function toggleReaction(recordId, stickerId){
  if(!currentUser){ toast('Vui lòng đăng nhập.','err'); return; }
  const { data: existing } = await sb.from('record_reactions').select('id').eq('record_id', recordId).eq('user_id', currentUser.id).eq('sticker_id', stickerId).maybeSingle();
  if(existing) await sb.from('record_reactions').delete().eq('id', existing.id);
  else await sb.from('record_reactions').insert({ record_id: recordId, user_id: currentUser.id, sticker_id: stickerId });
  await refreshRecordReactions(recordId);
}
async function refreshRecordReactions(recordId){
  const { data } = await sb.from('record_reactions').select('id,record_id,user_id,sticker_id,stickers(id,name,emoji,image_url)').eq('record_id', recordId);
  const bar = document.querySelector(`.reactions-bar[data-record-id="${recordId}"]`);
  if(!bar) return;
  const html = reactionsBarHTML(recordId, data || []);
  const tmp = document.createElement('div');
  tmp.innerHTML = html;
  bar.replaceWith(tmp.firstElementChild);
  attachReactionHandlers(recordId);
}
function attachReactionHandlers(recordId){
  const bar = document.querySelector(`.reactions-bar[data-record-id="${recordId}"]`);
  if(!bar) return;
  bar.querySelectorAll('.sticker-badge').forEach(b=>{ b.onclick = async ()=>{ await toggleReaction(recordId, b.dataset.stickerId); }; });
  const addBtn = bar.querySelector('.sticker-add-btn');
  if(addBtn) addBtn.onclick = (e)=>{ e.stopPropagation(); openStickerPicker(recordId, addBtn); };
}

const routes = {};
function route(p,h){ routes[p]=h; }
function navigate(h){ window.location.hash=h; closeMobileMenu(); }
async function resolveRoute(){
  const raw = window.location.hash.slice(1) || '/';
  const [path, queryStr] = raw.split('?');
  const query = Object.fromEntries(new URLSearchParams(queryStr || ''));
  for(const pattern in routes){
    const keys = [];
    const re = new RegExp('^'+pattern.replace(/:[^/]+/g, m=>{keys.push(m.slice(1)); return '([^/]+)';})+'$');
    const m = path.match(re);
    if(m){
      const params = {};
      keys.forEach((k,i)=>params[k]=decodeURIComponent(m[i+1]));
      params._query = query;
      if(currentUser) await refreshUnreadCount();
      app.innerHTML = '<div class="p-10 text-center text-[--tx2]">Đang tải...</div>';
      try{ await routes[pattern](params); }
      catch(e){ console.error(e); app.innerHTML = `<div class="p-10 text-center text-[--err]">Lỗi: ${esc(e.message)}</div>`; }
      return;
    }
  }
  render404();
}
window.addEventListener('hashchange', resolveRoute);

async function refreshUnreadCount(){
  if(!currentUser){ unreadCount = 0; return; }
  const { count } = await sb.from('records').select('*', { count:'exact', head:true }).eq('user_id', currentUser.id).in('status', ['approved','rejected']).is('notified_at', null);
  const { count: c2 } = await sb.from('notifications').select('*', { count:'exact', head:true }).eq('user_id', currentUser.id).is('read_at', null);
  unreadCount = (count||0) + (c2||0);
}

async function renderMaps(difficulty){
  let q = sb.from('maps').select('*').eq('is_active',true).order('difficulty',{ascending:false}).order('name',{ascending:true});
  if(difficulty) q = q.eq('difficulty', difficulty);
  const { data: maps, error } = await q;
  if(error) throw error;
  const ids = maps.map(m=>m.id);
  let bestByMap = {}, bestTByMap = {}, bestAByMap = {};
  if(ids.length){
    const { data: ranks } = await sb.from('map_rankings').select('map_id,time_ms,car,car_type,ingame_name').in('map_id',ids);
    const isCarT = (car)=> !!(car && car.trim().toUpperCase().startsWith('T'));
    const resolveType = (r)=> r.car_type || (isCarT(r.car) ? 'T' : 'A');
    (ranks||[]).forEach(r=>{
      if(!bestByMap[r.map_id] || r.time_ms < bestByMap[r.map_id].time_ms) bestByMap[r.map_id] = r;
      const t = resolveType(r);
      if(t==='T'){ if(!bestTByMap[r.map_id] || r.time_ms < bestTByMap[r.map_id].time_ms) bestTByMap[r.map_id] = r; }
      else { if(!bestAByMap[r.map_id] || r.time_ms < bestAByMap[r.map_id].time_ms) bestAByMap[r.map_id] = r; }
    });
  }
  const filters = [null, ...DIFFICULTIES];
  layout(`
    <div class="mb-4 md:mb-6"><div class="search-box" id="search-wrap"><span class="search-icon">🔍</span><input type="text" id="map-search" placeholder="Tìm kiếm map theo tên..." autocomplete="off"><button type="button" class="clear-btn" id="clear-search">✕</button></div></div>
    <div class="flex flex-wrap gap-2 mb-4 md:mb-6">${filters.map(f=>`<a onclick="navigate('${f?'/maps/difficulty/'+f:'/maps'}')" class="btn-s text-xs md:text-sm !py-1.5 !px-3" style="${(difficulty===f)?'background:var(--blue);color:#0a0a0a;border-color:var(--blue)':''}">${f?f+'⭐':'Tất cả'}</a>`).join('')}</div>
    <div id="maps-grid" class="grid grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3 md:gap-5">${maps.length?maps.map(m=>mapCard(m,bestByMap[m.id],bestTByMap[m.id],bestAByMap[m.id])).join(''):emptyState('Không có map nào.')}</div>
    <div id="no-result" class="hidden">${emptyState('Không tìm thấy map nào.')}</div>
  `);
  const searchInput = document.getElementById('map-search');
  const searchWrap = document.getElementById('search-wrap');
  const clearBtn = document.getElementById('clear-search');
  const grid = document.getElementById('maps-grid');
  const noResult = document.getElementById('no-result');
  function applySearch(){
    const kw = removeDiacritics(searchInput.value.trim());
    searchWrap.classList.toggle('has-value', searchInput.value.length > 0);
    if(!kw){ grid.innerHTML = maps.length ? maps.map(m=>mapCard(m,bestByMap[m.id],bestTByMap[m.id],bestAByMap[m.id])).join('') : emptyState('Không có map nào.'); grid.classList.remove('hidden'); noResult.classList.add('hidden'); return; }
    const filtered = maps.filter(m => removeDiacritics(m.name).includes(kw));
    if(filtered.length){ grid.innerHTML = filtered.map(m=>mapCard(m,bestByMap[m.id],bestTByMap[m.id],bestAByMap[m.id])).join(''); grid.classList.remove('hidden'); noResult.classList.add('hidden'); }
    else { grid.innerHTML = ''; grid.classList.add('hidden'); noResult.classList.remove('hidden'); }
  }
  searchInput.addEventListener('input', applySearch);
  clearBtn.addEventListener('click', ()=>{ searchInput.value=''; applySearch(); searchInput.focus(); });
}

      <div class="absolute bottom-2 left-2 right-2"><div class="font-bold text-white text-sm md:text-base leading-tight" style="text-shadow:0 1px 4px rgba(0,0,0,.8)">${esc(m.name)}</div></div>
    </div>
    <div class="p-2 md:p-3 space-y-0.5 text-[10px] md:text-xs text-[--tx2]">
      ${line('🏆 Chung:',best)}
      ${line('🅣 Xe T:',bestT)}

  </div>`;
}

function statsOf(list){
  if(!list.length) return null;
  const times = list.map(r=>r.time_ms);
  const avg = Math.round(times.reduce((a,b)=>a+b,0)/times.length);
  return { avg, max: Math.max(...times), min: Math.min(...times), count: times.length };
}

route('/leaderboard', async ()=>{

  if(perr) throw perr;

  if(rerr) throw rerr;
  const { data: top1Ranks } = await sb.from('map_rankings').select('map_id,user_id,time_ms,rank').eq('rank',1);

  (profiles||[]).forEach(p=>{ stats[p.id] = { profile:p, totalRecords:0, totalMaps:new Set(), top1Count:0, lastSubmit:null }; });

function actText(n){
  const a = `<b>${esc(n.actor?.ingame_name||'Ai đó')}</b>`;
  const q = n.content ? `: "${esc(n.content)}"` : '';
  switch(n.type){
    case 'react_record': return `${a} đã thả ${esc(n.content||'😀')} vào bài đăng của bạn`;
    case 'comment': return `${a} đã bình luận bài đăng của bạn${q}`;
    case 'reply': return `${a} đã trả lời bình luận của bạn${q}`;
    case 'mention': return `${a} đã nhắc đến bạn trong một bình luận${q}`;
    case 'react_comment': return `${a} đã thả ${esc(n.content||'😀')} vào bình luận của bạn`;
    case 'record_deleted': case 'comment_deleted': return `🗑️ ${esc(n.content||'')} <span class="text-[--tx2]">(bởi ${esc(n.actor?.ingame_name||'quản trị viên')})</span>`;

route('/notifications', async ()=>{
  if(!currentUser) return navigate('/login');
  const [{ data: notifs, error }, { data: acts }] = await Promise.all([
    sb.from('records').select('id,time_ms,car,pet,status,rejection_reason,approved_at,notified_at,maps(name,slug)').eq('user_id',currentUser.id).in('status',['approved','rejected']).order('approved_at',{ascending:false}).limit(100),

  ]);

    ${unread.length?`<h2 class="text-base md:text-lg font-bold mb-2 md:mb-3 mt-4">Kỷ lục chưa đọc (${unread.length})</h2><div class="space-y-2 mb-6 md:mb-8">${unread.map(n=>notifCard(n,true)).join('')}</div>`:''}
    ${read.length?`<h2 class="text-base md:text-lg font-bold mb-2 md:mb-3">Kỷ lục đã đọc</h2><div class="space-y-2 opacity-70">${read.map(n=>notifCard(n,false)).join('')}</div>`:''}
  `);
  const markAll = document.getElementById('mark-all-read');
  if(markAll) markAll.onclick = async ()=>{
    markAll.disabled = true;
    const now = new Date().toISOString();
    if(unread.length) await sb.from('records').update({ notified_at: now }).in('id', unread.map(n=>n.id));
    if(actUnread.length) await sb.from('notifications').update({ read_at: now }).in('id', actUnread.map(n=>n.id));
    await refreshUnreadCount(); toast('Đã đánh dấu tất cả đã đọc.'); resolveRoute();
  };
  document.querySelectorAll('.notif-item').forEach(el=>{
    el.onclick = async ()=>{ if(el.dataset.unread==='true'){ await sb.from('records').update({ notified_at:new Date().toISOString() }).eq('id',el.dataset.id); await refreshUnreadCount(); } navigate('/map/'+el.dataset.slug); };
  });
  document.querySelectorAll('.act-item').forEach(el=>{
    el.onclick = async ()=>{ if(el.dataset.unread==='true'){ await sb.from('notifications').update({ read_at:new Date().toISOString() }).eq('id',el.dataset.id); await refreshUnreadCount(); } if(el.dataset.link) navigate(el.dataset.link); };
  });
});
function notifCard(n, isUnread){
  const isApproved = n.status === 'approved';
  const color = isApproved ? 'var(--ok)' : 'var(--err)';
  const icon = isApproved ? '✅' : '❌';
  const title = isApproved ? 'Kỷ lục đã được duyệt' : 'Kỷ lục bị từ chối';
  const timeStr = n.approved_at ? new Date(n.approved_at).toLocaleString('vi-VN') : '';
  return `<div class="card p-3 md:p-4 cursor-pointer notif-item" data-id="${n.id}" data-slug="${esc(n.maps.slug)}" data-unread="${isUnread}"><div class="flex justify-between items-start gap-3"><div class="flex-1 min-w-0"><div class="flex items-center gap-2 mb-1 flex-wrap"><span>${icon}</span><span class="font-semibold text-sm md:text-base" style="color:${color}">${title}</span>${isUnread?`<span class="badge text-[10px]" style="background:var(--err);color:white">Mới</span>`:''}</div><div class="text-sm truncate">Map: <b>${esc(n.maps.name)}</b></div><div class="text-xs md:text-sm text-[--tx2] truncate"><span class="font-mono" style="color:var(--gold)">${msToStr(n.time_ms)}</span>${n.car?` · Xe: <b>${esc(n.car)}</b>`:''}${n.pet?` · Pet: <b>${esc(n.pet)}</b>`:''}</div>${!isApproved&&n.rejection_reason?`<div class="text-xs md:text-sm mt-1" style="color:var(--err)">Lý do: ${esc(n.rejection_reason)}</div>`:''}<div class="text-[10px] md:text-xs text-[--tx2] mt-1">${timeStr}</div></div></div></div>`;
}

route('/submit-record', async (params)=>{

  const presetSlug = params?._query?.map || null;
  const { data: maps } = await sb.from('maps').select('id,name,difficulty,slug').eq('is_active',true).order('difficulty',{ascending:false}).order('name',{ascending:true});

  layout(`
    <div class="max-w-lg mx-auto card p-4 md:p-8">
      <h1 class="text-xl md:text-2xl font-extrabold mb-1">Gửi kỷ lục</h1>
      <p class="text-sm text-[--tx2] mb-5 md:mb-6 flex items-center gap-2">${avatarHTML(currentProfile,'avatar avatar-sm')}Gửi với tư cách: <b>${esc(currentProfile?.ingame_name)}</b></p>
      <form id="f-rec" class="space-y-4">

        <div><label class="text-sm text-[--tx2]">Loại xe</label><select required name="car_type" class="mt-1"><option value="">-- Chọn loại xe --</option><option value="T">Xe T</option><option value="A">Xe A</option></select></div>
        <div class="grid grid-cols-2 gap-3"><div><label class="text-sm text-[--tx2]">Xe</label><input name="car" maxlength="64" placeholder="VD: T2 đặc cầu,T7 Vân Tiêu" class="mt-1"></div><div><label class="text-sm text-[--tx2]">Pet</label><input name="pet" maxlength="64" placeholder="VD:Gấu Bel,Linh Xà Sen Mộng" class="mt-1"></div></div>
        <div><label class="text-sm text-[--tx2]">Thời gian (MM:SS:mm)</label><input required name="time_str" placeholder="01:25:35" class="mt-1 font-mono"></div>
        <div><label class="text-sm text-[--tx2]">Ảnh bằng chứng (tối đa ${MAX_UPLOAD_MB}MB)</label><input required type="file" name="evidence_file" id="evidence_file" accept="image/png,image/jpeg,image/webp" class="mt-1"><img id="evidence_preview" class="hidden mt-2 max-h-48 rounded-lg border" style="border-color:var(--bd)"></div>
        <div><label class="text-sm text-[--tx2]">Ghi chú</label><textarea name="note" maxlength="500" class="mt-1" rows="2"></textarea></div>
        <label class="flex items-start gap-2 text-sm text-[--tx2]"><input required type="checkbox" name="confirm" class="mt-1 !w-auto">Tôi xác nhận thông tin chính xác.</label>
        <button class="btn-p w-full" type="submit">Gửi kỷ lục</button>
      </form>
    </div>`);
  filePreview(document.getElementById('evidence_file'), document.getElementById('evidence_preview'));
  const cb = document.getElementById('map-cb'), cbInput = document.getElementById('map-cb-input'), cbList = document.getElementById('map-cb-list'), cbValue = document.getElementById('map-cb-value'), cbClear = document.getElementById('map-cb-clear'), cbHint = document.getElementById('map-cb-hint');
  let highlightedIdx = -1, filtered = maps.slice();
  function renderList(){ if(!filtered.length){ cbList.innerHTML = '<div class="cb-empty">Không tìm thấy map nào.</div>'; return; } cbList.innerHTML = filtered.map((m,i)=>`<div class="cb-item ${i===highlightedIdx?'active':''}" data-idx="${i}"><span class="truncate">${esc(m.name)}</span><span class="cb-star">${stars(m.difficulty)}</span></div>`).join(''); cbList.querySelectorAll('.cb-item').forEach(el=>{ el.addEventListener('mousedown', (e)=>{ e.preventDefault(); selectMap(filtered[+el.dataset.idx]); }); }); }
  function filterList(){ const kw = removeDiacritics(cbInput.value.trim()); filtered = kw ? maps.filter(m=>removeDiacritics(m.name).includes(kw)) : maps.slice(); highlightedIdx = filtered.length ? 0 : -1; renderList(); }
  function openList(){ filterList(); cb.classList.add('open'); }
  function closeList(){ cb.classList.remove('open'); highlightedIdx = -1; }
  function selectMap(m){ cbInput.value = m.name; cbValue.value = m.id; cb.classList.add('has-value'); cbHint.innerHTML = `Đã chọn: <b class="text-white">${esc(m.name)}</b> (${m.difficulty}⭐)`; closeList(); }
  function clearSel(){ cbInput.value=''; cbValue.value=''; cb.classList.remove('has-value'); cbHint.textContent='Chưa chọn map'; closeList(); cbInput.focus(); }
  cbInput.addEventListener('focus', openList);
  cbInput.addEventListener('input', ()=>{ cbValue.value=''; cb.classList.toggle('has-value', cbInput.value.length>0); cbHint.textContent='Chưa chọn map'; openList(); });
  cbInput.addEventListener('keydown', (e)=>{ if(!cb.classList.contains('open') && (e.key==='ArrowDown'||e.key==='ArrowUp')){ openList(); return; } if(e.key==='ArrowDown'){ e.preventDefault(); if(filtered.length){ highlightedIdx=(highlightedIdx+1)%filtered.length; renderList(); } } else if(e.key==='ArrowUp'){ e.preventDefault(); if(filtered.length){ highlightedIdx=(highlightedIdx-1+filtered.length)%filtered.length; renderList(); } } else if(e.key==='Enter'){ if(cb.classList.contains('open') && highlightedIdx>=0 && filtered[highlightedIdx]){ e.preventDefault(); selectMap(filtered[highlightedIdx]); } } else if(e.key==='Escape'){ closeList(); } });
  cbClear.addEventListener('mousedown', (e)=>{ e.preventDefault(); clearSel(); });
  cbClear.addEventListener('click', (e)=>{ e.preventDefault(); clearSel(); });
  document.addEventListener('mousedown', (e)=>{ if(!cb.contains(e.target)) closeList(); });
  document.getElementById('f-rec').onsubmit = async (e)=>{
    e.preventDefault();
    const btn = e.target.querySelector('button[type=submit]'); btn.disabled = true;
    try{
      const fd = new FormData(e.target);
      const mapId = cbValue.value || fd.get('map_id');
      if(!mapId) throw new Error('Vui lòng chọn map.');
      if(!maps.some(m=>m.id===mapId)) throw new Error('Map không hợp lệ.');
      const time_ms = parseTimeStr(fd.get('time_str'));
      const file = fd.get('evidence_file');
      if(!file || !file.size) throw new Error('Chọn ảnh bằng chứng.');
      btn.textContent = 'Đang tải...';
      const { path } = await uploadImage('evidence', file, currentUser.id);
      btn.textContent = 'Đang gửi...';
      const car_type = fd.get('car_type');
      if(!car_type) throw new Error('Vui lòng chọn loại xe (A hoặc T).');
      const { error } = await sb.from('records').insert({ user_id: currentUser.id, map_id: mapId, time_ms, car_type, car: fd.get('car')||null, pet: fd.get('pet')||null, evidence_url: path, note: fd.get('note')||null, status: 'pending' });
      if(error) throw error;
      toast('Gửi kỷ lục thành công!');
      navigate('/my-records');
    }catch(err){ toast(err.message,'err'); btn.disabled=false; btn.textContent='Gửi kỷ lục'; }
  };
});

  }
  document.querySelectorAll('.approve-btn').forEach(btn=>{ btn.onclick = async ()=>{ if(!confirm('Duyệt kỷ lục này?')) return; btn.disabled=true; btn.textContent='Đang duyệt...'; const { error } = await sb.from('records').update({ status:'approved', approved_by: currentUser.id, approved_at: new Date().toISOString() }).eq('id', btn.dataset.id); if(error){ toast(error.message,'err'); btn.disabled=false; btn.textContent='✓ Duyệt'; return; } toast('Đã duyệt.'); resolveRoute(); }; });
  document.querySelectorAll('.reject-btn').forEach(btn=>{ btn.onclick = async ()=>{ const reason = prompt('Lý do từ chối:'); if(reason === null) return; btn.disabled=true; btn.textContent='Đang xử lý...'; const { error } = await sb.from('records').update({ status:'rejected', rejection_reason: reason||'Không đạt yêu cầu', approved_by: currentUser.id, approved_at: new Date().toISOString() }).eq('id', btn.dataset.id); if(error){ toast(error.message,'err'); btn.disabled=false; btn.textContent='✗ Từ chối'; return; } toast('Đã từ chối.'); resolveRoute(); }; });
});

// ============ ADMIN: MAPS ============
route('/admin/maps', async ()=>{
  if(!isModOrAdmin()){ toast('Không có quyền.','err'); return navigate('/'); }
  const { data: maps } = await sb.from('maps').select('*').order('difficulty',{ascending:false}).order('name',{ascending:true});
  layout(`
    <h1 class="text-xl md:text-2xl font-extrabold mb-4 md:mb-6">Quản lý map</h1>
    <div class="grid lg:grid-cols-[380px_1fr] gap-4 md:gap-6">
      <div class="card p-4 md:p-6 h-fit">
        <h2 class="font-bold mb-4">Thêm map mới</h2>
        <form id="f-map" class="space-y-4">
          <div><label class="text-sm text-[--tx2]">Tên map</label><input required name="name" id="map_name" class="mt-1"></div>
          <div><label class="text-sm text-[--tx2]">Slug</label><input required name="slug" id="map_slug" class="mt-1 font-mono text-sm" pattern="^[a-z0-9]+(-[a-z0-9]+)*$"></div>
          <div><label class="text-sm text-[--tx2]">Độ khó</label><select required name="difficulty" class="mt-1">${[7,6,5,4,3,2,1].map(n=>`<option value="${n}">${n}⭐</option>`).join('')}</select></div>
          <div><label class="text-sm text-[--tx2]">Mô tả</label><textarea name="description" rows="2" class="mt-1"></textarea></div>
          <div><label class="text-sm text-[--tx2]">Ảnh thumbnail</label><input type="file" name="thumbnail_file" id="thumb_file" accept="image/png,image/jpeg,image/webp" class="mt-1"><img id="thumb_preview" class="hidden mt-2 w-full aspect-video object-cover rounded-lg border" style="border-color:var(--bd)"></div>
          <label class="flex items-center gap-2 text-sm text-[--tx2]"><input type="checkbox" name="is_active" checked class="!w-auto"> Hiển thị công khai</label>
          <button class="btn-p w-full" type="submit">Thêm map</button>
        </form>
      </div>
      <div class="card overflow-hidden h-fit"><div class="table-wrap"><table class="w-full text-sm">
        <thead><tr class="text-left text-[--tx2] border-b" style="border-color:var(--bd)"><th class="p-2 md:p-3">Map</th><th class="p-2 md:p-3">Độ khó</th><th class="p-2 md:p-3 hide-mobile">Views</th><th class="p-2 md:p-3 hide-mobile">Trạng thái</th><th class="p-2 md:p-3"></th></tr></thead>
        <tbody>${maps.map(m=>`<tr class="border-b" style="border-color:var(--bd)">
          <td class="p-2 md:p-3 flex items-center gap-2">${m.thumbnail_url?`<img src="${esc(m.thumbnail_url)}" class="w-12 h-7 md:w-14 md:h-8 object-cover rounded">`:`<div class="w-12 h-7 rounded flex items-center justify-center" style="background:var(--bg2)">🏁</div>`}<span class="font-semibold text-xs md:text-sm">${esc(m.name)}</span></td>
          <td class="p-2 md:p-3 star-inline" style="color:var(--gold)">${stars(m.difficulty)}</td>
          <td class="p-2 md:p-3 hide-mobile text-xs">👁️ ${m.view_count||0}</td>
          <td class="p-2 md:p-3 hide-mobile"><span class="badge" style="background:var(--bg2);color:${m.is_active?'var(--ok)':'var(--tx2)'}">${m.is_active?'Đang hiện':'Đã ẩn'}</span></td>
          <td class="p-2 md:p-3 text-right whitespace-nowrap"><button class="btn-s text-[10px] md:text-xs !py-1 !px-2 toggle-active" data-id="${m.id}" data-active="${m.is_active}">${m.is_active?'Ẩn':'Hiện'}</button><button class="btn-s text-[10px] md:text-xs !py-1 !px-2 delete-map" data-id="${m.id}" style="color:var(--err)">Xóa</button></td>
        </tr>`).join('')||`<tr><td class="p-6 text-center text-[--tx2]" colspan="5">Chưa có map nào.</td></tr>`}</tbody>
      </table></div></div>
    </div>`);
  document.getElementById('map_name').addEventListener('input', (e)=>{ document.getElementById('map_slug').value = slugify(e.target.value); });
  filePreview(document.getElementById('thumb_file'), document.getElementById('thumb_preview'));
  document.getElementById('f-map').onsubmit = async (e)=>{
    e.preventDefault();
    const btn = e.target.querySelector('button'); btn.disabled=true; btn.textContent='Đang lưu...';
    try{
      const fd = new FormData(e.target);
      const difficulty = +fd.get('difficulty');
      if(![1,2,3,4,5,6,7].includes(difficulty)) throw new Error('Độ khó không hợp lệ.');
      const insert = { name: fd.get('name'), slug: fd.get('slug'), difficulty, description: fd.get('description')||null, is_active: fd.get('is_active')==='on', created_by: currentUser.id };
      const file = fd.get('thumbnail_file');
      if(file && file.size){ btn.textContent='Đang tải ảnh...'; const { url } = await uploadImage('map-thumbnails', file, insert.slug); insert.thumbnail_url = url; }
      btn.textContent='Đang lưu...';
      const { error } = await sb.from('maps').insert(insert);
      if(error) throw error;
      toast('Đã thêm map.');
      navigate('/admin/maps'); resolveRoute();
    }catch(err){ let msg = err.message; if(msg.includes('duplicate key')) msg='Slug đã tồn tại.'; if(msg.includes('check constraint')) msg='Lỗi constraint difficulty. Chạy SQL để cho phép 1-7.'; toast(msg,'err'); btn.disabled=false; btn.textContent='Thêm map'; }
  };
  document.querySelectorAll('.toggle-active').forEach(btn=>{ btn.onclick = async ()=>{ const { error } = await sb.from('maps').update({ is_active: btn.dataset.active!=='true' }).eq('id', btn.dataset.id); if(error) return toast(error.message,'err'); resolveRoute(); }; });
  document.querySelectorAll('.delete-map').forEach(btn=>{ btn.onclick = async ()=>{ if(!confirm('Xóa map?')) return; const { error } = await sb.from('maps').delete().eq('id', btn.dataset.id); if(error) return toast('Không xóa được: map đã có kỷ lục.','err'); toast('Đã xóa.'); resolveRoute(); }; });
});

// ============ ADMIN: SETTINGS ============
route('/admin/settings', async ()=>{
  if(!isAdmin()){ toast('Không có quyền.','err'); return navigate('/'); }
  const { data: cfg } = await sb.from('clan_settings').select('*').eq('id',true).single();
  layout(`<div class="max-w-lg mx-auto card p-4 md:p-8">
    <h1 class="text-xl md:text-2xl font-extrabold mb-4 md:mb-6">Cài đặt clan</h1>
    <form id="f-settings" class="space-y-4">
      <div><label class="text-sm text-[--tx2]">Tên clan</label><input name="clan_name" value="${esc(cfg.clan_name)}" required class="mt-1"></div>
      <div><label class="text-sm text-[--tx2]">Slogan</label><input name="slogan" value="${esc(cfg.slogan)}" class="mt-1"></div>
      <div><label class="text-sm text-[--tx2]">Logo</label><br>${cfg.logo_url?`<img src="${esc(cfg.logo_url)}" class="h-16 w-16 rounded object-cover my-2">`:'<p class="text-sm text-[--tx2] my-2">Chưa có logo</p>'}<input type="file" name="logo_file" accept="image/png,image/jpeg,image/webp" class="mt-1"></div>
      <div class="grid grid-cols-2 gap-3"><div><label class="text-sm text-[--tx2]">Màu chính</label><input type="color" name="color_primary" value="${esc(cfg.color_primary)}" class="mt-1 h-10 !p-1"></div><div><label class="text-sm text-[--tx2]">Màu nhấn</label><input type="color" name="color_accent" value="${esc(cfg.color_accent)}" class="mt-1 h-10 !p-1"></div></div>
      <button class="btn-p w-full" type="submit">Lưu cài đặt</button>
    </form>
  </div>`);
  document.getElementById('f-settings').onsubmit = async (e)=>{ e.preventDefault(); const btn=e.target.querySelector('button'); btn.disabled=true; btn.textContent='Đang lưu...'; try{ const fd=new FormData(e.target); const update={ clan_name:fd.get('clan_name'), slogan:fd.get('slogan'), color_primary:fd.get('color_primary'), color_accent:fd.get('color_accent'), updated_by: currentUser.id }; const logoFile=fd.get('logo_file'); if(logoFile&&logoFile.size){ const { url } = await uploadImage('branding', logoFile, 'logo'); update.logo_url = url; } const { error } = await sb.from('clan_settings').update(update).eq('id',true); if(error) throw error; await loadClanSettings(); toast('Đã lưu.'); navigate('/'); }catch(err){ toast(err.message,'err'); btn.disabled=false; btn.textContent='Lưu cài đặt'; } };
});

// ============ ADMIN: MEMBERS ============
route('/admin/members', async ()=>{
  if(!isAdmin()){ toast('Chỉ admin.','err'); return navigate('/'); }
  const { data: members } = await sb.from('profiles').select('*').order('joined_at');
  layout(`<h1 class="text-xl md:text-2xl font-extrabold mb-4 md:mb-6">Quản lý thành viên</h1>
    <div class="card overflow-hidden"><div class="table-wrap"><table class="w-full text-sm">
      <thead><tr class="text-left text-[--tx2] border-b" style="border-color:var(--bd)"><th class="p-2 md:p-3">Thành viên</th><th class="p-2 md:p-3">Vai trò</th><th class="p-2 md:p-3 hide-mobile">Trạng thái</th><th class="p-2 md:p-3"></th></tr></thead>
      <tbody>${members.map(m=>memberRow(m)).join('')}</tbody>
    </table></div></div>`);
  document.querySelectorAll('.role-select').forEach(sel=>{ sel.onchange = async ()=>{ const { error } = await sb.from('profiles').update({ role: sel.value }).eq('id', sel.dataset.uid); if(error) return toast(error.message,'err'); toast('Đã cập nhật vai trò.'); }; });
  document.querySelectorAll('.status-toggle').forEach(btn=>{ btn.onclick = async ()=>{ if(btn.dataset.uid===currentUser.id) return toast('Không thể tự khóa.','err'); const newStatus = btn.dataset.status==='active' ? 'suspended' : 'active'; const { error } = await sb.from('profiles').update({ status: newStatus }).eq('id', btn.dataset.uid); if(error) return toast(error.message,'err'); toast('Đã cập nhật.'); resolveRoute(); }; });
  document.querySelectorAll('.reset-pass').forEach(btn=>{ btn.onclick = async ()=>{ const p1 = prompt(`Mật khẩu mới cho ${btn.dataset.name}:`); if(!p1) return; if(p1.length < 6) return toast('Tối thiểu 6 ký tự.','err'); const { error } = await sb.rpc('admin_reset_password', { target_user_id: btn.dataset.uid, new_password: p1 }); if(error) return toast(error.message,'err'); toast(`Đã đặt lại MK cho ${btn.dataset.name}.`); }; });
});
function memberRow(m){
  const isSelf = currentUser && m.id===currentUser.id;
  return `<tr class="border-b" style="border-color:var(--bd)">
    <td class="p-2 md:p-3"><div class="flex items-center gap-2">${avatarHTML(m,'avatar avatar-sm')}<div class="min-w-0"><div class="font-semibold text-xs md:text-sm truncate">${esc(m.ingame_name)}</div><div class="text-[10px] md:text-xs text-[--tx2]">@${esc(m.username)}</div></div></div></td>
    <td class="p-2 md:p-3"><select class="role-select !py-1 !px-2 text-xs md:text-sm !w-auto" data-uid="${m.id}" ${isSelf?'disabled':''}>${['member','moderator','admin'].map(r=>`<option value="${r}" ${m.role===r?'selected':''}>${r}</option>`).join('')}</select></td>
    <td class="p-2 md:p-3 hide-mobile"><span class="badge" style="background:var(--bg2);color:${m.status==='active'?'var(--ok)':'var(--err)'}">${m.status==='active'?'Hoạt động':'Đã khóa'}</span></td>
    <td class="p-2 md:p-3 whitespace-nowrap"><a onclick="navigate('/user/${esc(m.username)}')" class="btn-s text-[10px] md:text-xs !py-1 !px-2">📖 Blog</a><button class="status-toggle btn-s text-[10px] md:text-xs !py-1 !px-2" data-uid="${m.id}" data-status="${m.status}" ${isSelf?'disabled':''}>${m.status==='active'?'Khóa':'Mở khóa'}</button><button class="reset-pass btn-s text-[10px] md:text-xs !py-1 !px-2" data-uid="${m.id}" data-name="${esc(m.ingame_name)}">Đặt MK</button></td>
  </tr>`;
}

// ============ INIT ============
(async function init(){
  await loadClanSettings();
  await loadSession();
  sb.auth.onAuthStateChange(async ()=>{ await loadSession(); resolveRoute(); });
  await resolveRoute();
})();
</script>
</body>
</html>
